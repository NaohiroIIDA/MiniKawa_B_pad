; M5Atom Lite + Bluetooth ゲームパッド + 連続回転サーボ ロボット
;
; ゲームパッド接続には Bluepad32 を使用します。
; Bluepad32 は Bluetooth Classic を含むスタックを組み込んだ専用の Arduino コアとして
; 配布されているため、公式 espressif32 プラットフォームのフレームワークを差し替えます。

[env:m5atom_lite]
platform = espressif32@6.5.0
board = m5stack-atom
framework = arduino
platform_packages =
    framework-arduinoespressif32 @ https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases/download/4.1.0/esp32-bluepad32-4.1.0.zip

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 1500000

build_flags =
    -DCORE_DEBUG_LEVEL=1
