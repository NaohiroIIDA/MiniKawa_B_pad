; M5Atom Lite + Bluetooth gamepad + continuous-rotation servo robot
;
; Gamepad connectivity uses Bluepad32.
; Bluepad32 is distributed as a custom Arduino core with its Bluetooth stack (including
; Bluetooth Classic) built in, so we replace the official espressif32 platform's framework.

[env:m5atom_lite]
platform = espressif32@6.5.0
board = m5stack-atom
framework = arduino
platform_packages =
    framework-arduinoespressif32 @ https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases/download/4.1.0/esp32-bluepad32-4.1.0.zip

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 1500000

build_flags =
    -DCORE_DEBUG_LEVEL=1
